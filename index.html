<!-- index.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>15分タイマーゲーム</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- スタート画面 -->
  <div id="start-screen" class="screen">
    <h1>スタート画面</h1>
    <button id="start-button">スタート</button>
  </div>

  <!-- ゲーム画面 -->
  <div id="game-screen" class="screen" style="display: none;">
    <h2>残り時間: <span id="timer">15:00</span></h2>
    <div id="question-area">
      <!-- 問題文や画像表示 -->
      <h3 id="stage-number"></h3>
      <img id="question-image" src="" alt="" style="max-width: 200px;">
      <p id="question-text"></p>
      <p><a href="#" id="hint-link">ヒントを見る</a></p>
    </div>
    <div id="answer-area">
      <input type="text" id="user-answer" placeholder="答えを入力してください">
      <button id="submit-answer">送信</button>
    </div>
  </div>

  <!-- リザルト画面 -->
  <div id="result-screen" class="screen" style="display: none;">
    <h2 id="result-message">リザルト</h2>
    <img id="result-image" src="" alt="" style="max-width: 200px;">
    <p>受付に戻ってね</p>
    <button id="reset-button">もう一度遊ぶ</button>
  </div>

  <!-- モーダルダイアログ -->
  <div id="hint-modal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h3>ヒント</h3>
        <span class="close-button">&times;</span>
      </div>
      <div class="modal-body">
        <p id="hint-text"></p>
      </div>
      <div class="modal-footer">
        <button id="close-hint">閉じる</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
